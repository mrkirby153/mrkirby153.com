name: Deploy Site
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: "^11.0.0"
      - name: Set up Node.JS
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install -P --frozen-lockfile
      - name: Restore Astro caches
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.astro
            .astro/blurhash-cache.json
          key: ${{ runner.os }}-astro-v1-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-v1-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Connect to tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-dns=false
      - name: Build site
        run: pnpm build
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/production
          chmod 600 ~/.ssh/production
          cat >> ~/.ssh/config <<EOF
          Host production
            HostName $DEPLOY_HOST
            User ci
            IdentityFile ~/.ssh/production
            StrictHostKeyChecking no
          EOF
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      - name: Deploy site
        run: |
          rsync -avz --delete dist/ production:/var/www/mrkirby153.com
